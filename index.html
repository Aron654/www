<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0e1116">
<title>Kassel Hub</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%236ea8fe'/%3E%3Cpath d='M11 9v14M11 16l9-7M11 16l9 7' stroke='%230e1116' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #0e1116;
    --card: #161b22;
    --card-hover: #1b222b;
    --border: #262d38;
    --text: #e6edf3;
    --muted: #8b96a5;
    --shadow: 0 8px 24px rgba(0, 0, 0, .35);
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f4f6f9;
      --card: #ffffff;
      --card-hover: #fbfcfe;
      --border: #dde3ea;
      --text: #1b2330;
      --muted: #627084;
      --shadow: 0 8px 24px rgba(30, 50, 80, .12);
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .wrap {
    max-width: 920px;
    margin: 0 auto;
    padding: 48px 16px 32px;
  }
  header { margin-bottom: 36px; }
  header h1 {
    margin: 0;
    font-size: clamp(1.6rem, 5vw, 2.2rem);
    letter-spacing: -.02em;
  }
  header p { margin: 4px 0 0; color: var(--muted); }
  section { margin-bottom: 32px; }
  h2 {
    margin: 0 0 12px;
    font-size: .8rem;
    font-weight: 600;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 14px;
  }
  .card {
    --c: #6ea8fe;
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 18px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    color: inherit;
    text-decoration: none;
    transition: transform .15s ease, border-color .15s ease, background .15s ease, box-shadow .15s ease;
  }
  .card:hover, .card:focus-visible {
    transform: translateY(-3px);
    border-color: var(--c);
    background: var(--card-hover);
    box-shadow: var(--shadow);
    outline: none;
  }
  .ico {
    display: grid;
    place-items: center;
    width: 44px;
    height: 44px;
    margin-bottom: 6px;
    border-radius: 11px;
    color: var(--c);
    background: color-mix(in srgb, var(--c) 16%, transparent);
  }
  .ico svg { width: 24px; height: 24px; }
  .card strong { font-size: 1.1rem; }
  .card small { color: var(--muted); font-size: .9rem; }
  .host {
    margin-top: 8px;
    font: .78rem ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: var(--muted);
    word-break: break-all;
  }
  .arrow {
    position: absolute;
    top: 18px;
    right: 18px;
    color: var(--muted);
    transition: transform .15s ease, color .15s ease;
  }
  .card:hover .arrow, .card:focus-visible .arrow {
    color: var(--c);
    transform: translate(2px, -2px);
  }
  footer {
    margin-top: 40px;
    color: var(--muted);
    font-size: .8rem;
    text-align: center;
  }
  @media (prefers-reduced-motion: reduce) {
    .card, .arrow { transition: none; }
    .card:hover, .card:focus-visible { transform: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="greeting">Szia!</h1>
    <p id="date">Kassel Hub</p>
  </header>

  <section aria-labelledby="home">
    <h2 id="home">Otthon</h2>
    <div class="grid">

      <a class="card" style="--c:#2dd4bf" href="https://qbit.kassel.hu" target="_blank" rel="noopener">
        <svg class="arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"/></svg>
        <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m0 0-5-5m5 5 5-5M5 21h14"/></svg></span>
        <strong>qBittorrent</strong>
        <small>Letöltések kezelése</small>
        <span class="host">qbit.kassel.hu</span>
      </a>

      <a class="card" style="--c:#fbbf24" href="http://plex.kassel.hu:32400/web" target="_blank" rel="noopener">
        <svg class="arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"/></svg>
        <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="m10 8.5 5 2.5-5 2.5zM8 21h8"/></svg></span>
        <strong>Plex</strong>
        <small>Filmek és sorozatok</small>
        <span class="host">plex.kassel.hu:32400</span>
      </a>

    </div>
  </section>

  <section aria-labelledby="vps">
    <h2 id="vps">VPS</h2>
    <div class="grid">

      <a class="card" style="--c:#a78bfa" href="https://panel.nexussmp.hu" target="_blank" rel="noopener">
        <svg class="arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"/></svg>
        <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="6" rx="1.5"/><rect x="3" y="14" width="18" height="6" rx="1.5"/><path d="M7 7h.01M7 17h.01"/></svg></span>
        <strong>Pelican Panel</strong>
        <small>Játékszerverek</small>
        <span class="host">panel.nexussmp.hu</span>
      </a>

      <a class="card" style="--c:#60a5fa" href="https://phpmyadmin.nexussmp.hu" target="_blank" rel="noopener">
        <svg class="arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"/></svg>
        <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><ellipse cx="12" cy="5.5" rx="8" ry="3"/><path d="M4 5.5v13c0 1.7 3.6 3 8 3s8-1.3 8-3v-13M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></svg></span>
        <strong>phpMyAdmin</strong>
        <small>Adatbázisok</small>
        <span class="host">phpmyadmin.nexussmp.hu</span>
      </a>

    </div>
  </section>

  <footer>Védve: Cloudflare Access</footer>
</div>

<script>
  (function () {
    var now = new Date();
    var h = now.getHours();
    var hello = h >= 5 && h < 10 ? "Jó reggelt" :
                h >= 10 && h < 18 ? "Szép napot" :
                h >= 18 && h < 22 ? "Jó estét" : "Jó éjszakát";
    document.getElementById("greeting").textContent = hello + "!";
    try {
      document.getElementById("date").textContent =
        now.toLocaleDateString("hu-HU", { weekday: "long", year: "numeric", month: "long", day: "numeric" });
    } catch (e) {}
  })();
</script>
</body>
</html>
